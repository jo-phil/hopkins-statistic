[project]
name = "hopkins-statistic"
version = "0.7.0"
description = "Compute the Hopkins statistic to assess clustering tendency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Johann Philipp Gorzny"}
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
]

keywords = [
    "cluster-analysis", "clusterability", "clustering-tendency",
    "data-mining", "data-science", "data-analysis", "hopkins-statistic",
    "machine-learning", "spatial-randomness", "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://jo-phil.github.io/hopkins-statistic/"
Repository = "https://github.com/jo-phil/hopkins-statistic"
Issues = "https://github.com/jo-phil/hopkins-statistic/issues"
Changelog = "https://jo-phil.github.io/hopkins-statistic/changelog/"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-examples>=0.0.18",
    "ruff>=0.14.8",
    "scipy-stubs>=1.16.3.3",
    "ty>=0.0.29",
]
docs = [
    "changelog-slugs>=0.1.0",
    "markdown-exec>=1.12.1",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.32",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
markers = ["slow: slow statistical tests"]
strict = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.rules]
all = "error"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma, handled by formatter
    "E501",     # line-too-long, handled by formatter
    "PLR0913",  # too-many-arguments, conflicts with a flat API design
    "PLR2004",  # magic-value-comparison, considers 2 a magic number

    # irrelevant
    "AIR", "ASYNC", "DJ", "FAST", "PD", "PYI",
]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_in", "H"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "INP001", "N802", "N803", "N806", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
